name = "away-radar"
main = "src/index.js"
compatibility_date = "2026-10-10"

[vars]
DEFAULT_CHAIN = "solana"
ALLOWED_ORIGIN = "https://tiagofaraujo.github.io"

# Secrets to add after first deployment:
# wrangler secret put ADMIN_TOKEN
# wrangler secret put WEBHOOK_SECRET
#
# Create the KV namespace and replace the placeholders:
# wrangler kv namespace create RADAR_CACHE
# wrangler kv namespace create RADAR_CACHE --preview
#
# [[kv_namespaces]]
# binding = "RADAR_CACHE"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[triggers]
crons = ["*/15 * * * *"]
